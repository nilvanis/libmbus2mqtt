name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (including dev extras)
        run: uv sync --locked --extra dev --python 3.11

      - name: Run ruff check
        run: uv run --no-sync ruff check src tests scripts

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check src tests scripts

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (including dev extras)
        run: uv sync --locked --extra dev --python 3.11

      - name: Run mypy
        run: uv run --no-sync mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (including dev extras)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync pytest --cov=src/libmbus2mqtt --cov-report=term-missing

  package:
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --extra dev --python 3.11
      - run: uv build
      - run: uv run --no-sync python scripts/smoke_package.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 5

  container:
    name: Container integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: libmbus2mqtt:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: python3 scripts/smoke_container.py libmbus2mqtt:smoke
